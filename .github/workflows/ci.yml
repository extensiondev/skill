name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout Extension.js (conventions-sync source of truth)
        uses: actions/checkout@v5
        with:
          repository: extension-js/extension.js
          ref: v4.2.0
          path: extension.js

      - name: Checkout the MCP server (mcp-sync source of truth)
        uses: actions/checkout@v5
        with:
          repository: extensiondev/mcp
          path: mcp

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: node --test --import ./test/setup/network-guard.preload.mjs test/*.test.mjs
        env:
          EXTENSION_JS_REPO: ${{ github.workspace }}/extension.js
          EXTENSION_DEV_MCP_REPO: ${{ github.workspace }}/mcp

      - name: Template slugs and the MCP server pin against the live registries
        run: node --test test/templates-sync.test.mjs test/mcp-sync.test.mjs
        env:
          SKILL_LIVE_REGISTRY: "1"
          EXTENSION_JS_REPO: ${{ github.workspace }}/extension.js
          EXTENSION_DEV_MCP_REPO: ${{ github.workspace }}/mcp

      - name: Validate against the Agent Skills spec
        run: npx -y skills-ref validate skills/browser-extension

      - name: The plugin folder matches its source
        run: node scripts/build-plugin.mjs --check

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the plugin and the marketplace strictly
        run: |
          claude plugin validate --strict plugin
          claude plugin validate --strict .

  antigravity:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install the Antigravity CLI
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate the plugin for Antigravity
        run: |
          agy plugin validate plugin --json > agy-validate.json
          cat agy-validate.json
          jq -e '[.findings[] | select(.severity == "error" or ((.file | IN(".mcp.json", "mcp.json", "plugin.json")) | not))] | length == 0' agy-validate.json
