name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to publish (for example 0.1.1)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout Extension.js (conventions-sync source of truth)
        uses: actions/checkout@v5
        with:
          repository: extension-js/extension.js
          path: extension.js

      - name: Checkout the MCP server (mcp-sync source of truth)
        uses: actions/checkout@v5
        with:
          repository: extensiondev/mcp
          path: mcp

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Validate version
        id: validate
        shell: bash
        run: |
          VERSION="$(echo "${{ inputs.version }}" | xargs)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be plain semver, for example 0.1.1" >&2
            exit 1
          fi
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally" >&2
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "Tag $TAG already exists on origin" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$VERSION" '/^## /{p=($2==ver); next} p' CHANGELOG.md \
            | sed -e '/./,$!d' > "$NOTES_FILE"
          if ! grep -q '[^[:space:]]' "$NOTES_FILE"; then
            echo "CHANGELOG.md has no '## $VERSION' section. Write the changelog entry and push it before releasing." >&2
            exit 1
          fi
          echo "Release notes for $VERSION:"
          cat "$NOTES_FILE"
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Test
        run: node --test test/*.test.mjs
        env:
          EXTENSION_JS_REPO: ${{ github.workspace }}/extension.js
          EXTENSION_DEV_MCP_REPO: ${{ github.workspace }}/mcp

      - name: Read package metadata
        id: meta
        shell: bash
        run: |
          echo "name=$(node -p 'require("./package.json").name')" >> "$GITHUB_OUTPUT"
          echo "publish_access=$(node -p 'require("./package.json").publishConfig?.access || "public"')" >> "$GITHUB_OUTPUT"

      - name: Check published version
        shell: bash
        run: |
          PKG="${{ steps.meta.outputs.name }}"
          VER="${{ steps.validate.outputs.version }}"
          if npm view "$PKG@$VER" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$PKG@$VER is already published" >&2
            exit 1
          fi

      - name: Update package version
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          node -e "const fs=require('fs');const p='.claude-plugin/plugin.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          node -e "const fs=require('fs');const p='.claude-plugin/marketplace.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));for(const e of j.plugins)e.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          node -e "const fs=require('fs');const p='skills/extension-dev/SKILL.md';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace(/^(  version: ).*$/m,\`\$1\${process.env.VERSION}\`))"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The main ruleset requires the verify check on every push and lists
      # deploy keys as its bypass actor, so the release bump rides the
      # repo-scoped deploy key instead of the runner token. Ruled by Cezar
      # 2026-08-03 after the mcp lane was rejected mid-release.
      - name: Authenticate the release push as the deploy key
        env:
          RELEASE_PUSH_KEY: ${{ secrets.RELEASE_PUSH_KEY }}
        run: |
          if [ -z "$RELEASE_PUSH_KEY" ]; then
            echo "RELEASE_PUSH_KEY is unset; the bump push would be rejected by the main ruleset" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$RELEASE_PUSH_KEY" > ~/.ssh/release_push_key
          chmod 600 ~/.ssh/release_push_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote set-url --push origin "git@github.com:${{ github.repository }}.git"
          git config core.sshCommand "ssh -i ~/.ssh/release_push_key -o IdentitiesOnly=yes"

      - name: Commit and tag release
        env:
          VERSION: ${{ steps.validate.outputs.version }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          git add package.json .claude-plugin skills/extension-dev/SKILL.md
          if ! git diff --cached --quiet; then
            git commit -m "Release v$VERSION"
          fi
          git tag -a "$TAG" --cleanup=whitespace -F "${{ steps.notes.outputs.file }}"
          git push
          git push origin "$TAG"

      - name: Prepare npm README
        run: node scripts/readme-logo-width.mjs npm

      # OIDC trusted publishing needs npm >= 11.5.1; pin the newest npm so we
      # never depend on which patch of npm the Node runtime happens to ship.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # No NODE_AUTH_TOKEN: npm authenticates via the GitHub OIDC token
      # (id-token: write above) against the trusted publisher configured on
      # npmjs.com for this repo/workflow. Repo is public, so provenance is
      # generated automatically.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access ${{ steps.meta.outputs.publish_access }} --tag latest --ignore-scripts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.validate.outputs.version }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "v$VERSION" \
            --notes-file "${{ steps.notes.outputs.file }}"
